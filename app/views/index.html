<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Store Management - Login & Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1e2a3a;
            color: #e1e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #2a2e38;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #5A8FBD;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
        }

        h3 {
            margin-bottom: 20px;
            color: #5A8FBD;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 18px;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        input[type="password"],
        .form-group select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #5a8fbd;
            background-color: #2a3b4c;
            color: #fff;
        }

        .form-group label {
            color: #a8c1d1;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #a8c1d1;
        }



        /*date and dropdown style*/
        input[type="date"],
        .form-group select{
            color: #ffffff69;
        }

        input[type="date"]:focus,
        .form-group select:focus {
            color: #fff;
        }

        .btn {
            background-color: #5a8fbd;
            color: white;
            padding: 12px;
            width: 87%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #3b6c8e;
        }


        /*new style add*/
        .btn{
            margin : 0px 0px 20px 0px;
        }

        a{
            color: #5a8fbd;
        }

        

        /*message style*/
        .message{
            font-size: small;
            margin: 0px 0px 10px 0px;
        }

    </style>
</head>

<body>
    <div class="container">
        <h1>Medical Store Management</h1>


        
        <!-- invalid password message -->
        <div class="message" style="display: none">
            Incorrect username or password. Please try again.
        </div>



        <div class="sub-container s1">
            <h3>Sign In Page</h3>
            <form id="Loginform">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                </div>
                <button type="submit" class="Loginform-btn btn" onclick="Loginform()">Login</button>
            </form>
            <div class="signup-box">
                <p>Don't have an account? <a href="#" onclick="showContainer2()">Sign Up</a></p>
            </div>
        </div>



        <div class="sub-container s2" style="display: none">
            <h3>Sign Up Page</h3>
            <form id="signupform1">
                <div class="form-group">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Enter Firstname" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Enter Lastname" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select name="gender" id="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number:</label>
                    <input type="tel" id="mobile" name="mobile" maxlength="10" placeholder="Enter your mobile number"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" placeholder="Enter Address" required>
                </div>

                <button type="button" class="next-btn btn" onclick="showContainer3()">Next</button>
            </form>
            <div class="signin-box">
                <p>Already have an account? <a href="#" onclick="showContainer1()">Sign In</a></p>
            </div>
        </div>



        <div class="sub-container s3" style="display: none">
            <h3>Sign Up Page</h3>
            <form id="signupform2">
                <div class="form-group">
                    <label for="Cusername">Username:</label>
                    <input type="text" id="Cusername" name="username" placeholder="Create Username" required>
                </div>

                <div class="form-group">
                    <label for="Cpassword1">Password:</label>
                    <input type="password" id="Cpassword1" name="password1" placeholder="Create Password" required>
                    <input type="password" id="Cpassword2" name="password2" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="signupform-btn btn" onclick="Signupform()">Sign Up</button>
            </form>
            <button class="back-btn btn" onclick="showContainer2()">Back</button>
        </div>
    </div>



    <script src="index.js"></script>
    <script src="extra.js"></script>
</body>

</html>
